<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<link rel="manifest" href="manifest.json">
<title>Yonas Workout Tracker v2</title>
<style>
:root{--bg:#0b1220;--panel:#111b2e;--card:#162238;--text:#f7f9fc;--muted:#9fb0c8;--accent:#4f8cff;--yellow:#f5c451;--red:#ea6b6b;--green:#54c18b;--line:#263650}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:88px}
header{position:sticky;top:0;z-index:10;padding:18px 16px;background:rgba(11,18,32,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
h1{font-size:1.15rem;margin:0}.sub{color:var(--muted);font-size:.85rem;margin-top:4px}
main{padding:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:14px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:var(--card);border-radius:14px;padding:13px}.metric small{color:var(--muted);display:block}.metric strong{font-size:1.2rem}
button,input,select{font:inherit}button{border:0;border-radius:12px;padding:12px 14px;font-weight:800}.primary{background:var(--accent);color:white}.secondary{background:var(--card);color:var(--text);border:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.tab{white-space:nowrap;background:var(--card);color:var(--muted)}.tab.active{background:var(--accent);color:white}
.splitHead{text-align:center;background:rgba(84,193,139,.16);border:1px solid rgba(84,193,139,.4);padding:12px;border-radius:12px;font-weight:900;margin-bottom:12px}
.superset{background:rgba(245,196,81,.16);border-top:2px solid var(--yellow);border-bottom:2px solid var(--yellow);padding:9px;text-align:center;font-weight:900;margin:14px 0 8px;color:#ffe89b}
.exercise{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:10px}.exercise.main{outline:2px solid rgba(79,140,255,.35)}.exercise.finisher{outline:2px solid rgba(234,107,107,.35)}
.exercise h3{margin:0 0 4px;font-size:1rem}.meta{color:var(--muted);font-size:.82rem;margin-bottom:10px}
.gridInputs{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:8px}label{font-size:.72rem;color:var(--muted)}input,select{width:100%;margin-top:4px;background:#0e1728;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}
.full{width:100%}.msg{min-height:20px;color:var(--green);font-weight:800;margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:#0e1728;border-top:1px solid var(--line);display:flex;justify-content:center}.navin{width:100%;max-width:760px;display:grid;grid-template-columns:repeat(5,1fr)}nav button{background:transparent;color:var(--muted);border-radius:0;padding:13px 4px;font-size:.76rem}nav button.active{color:white}
.hidden{display:none!important}.list{display:grid;gap:8px}.historyItem{background:var(--card);border-radius:12px;padding:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:.84rem}td,th{padding:9px;border-bottom:1px solid var(--line);text-align:left}canvas{width:100%;height:250px;background:#0e1728;border-radius:12px}
.note{color:var(--muted);font-size:.85rem;line-height:1.45}.danger{background:#5a2430;color:#ffd9df}
@media(max-width:520px){.gridInputs{grid-template-columns:1fr 1fr}.gridInputs>div:first-child{grid-column:1/-1}}
</style>
</head>
<body>
<div class="app">
<header><h1 id="title">Workout Tracker</h1><div class="sub">Offline personal strength log</div></header>
<main>
<section id="home">
  <div class="card"><div class="metrics">
    <div class="metric"><small>Next workout</small><strong id="next">Split A</strong></div>
    <div class="metric"><small>Completed</small><strong id="done">0</strong></div>
    <div class="metric"><small>Last workout</small><strong id="last">—</strong></div>
    <div class="metric"><small>Personal records</small><strong id="prCount">0</strong></div>
  </div></div>
  <div class="card"><button class="primary full" id="startBtn">Start next workout</button></div>
  <div class="card"><div class="note"><b>Push</b> = chest and triceps. <b>Pull</b> = back and biceps. Yellow rows mark supersets.</div></div>
</section>

<section id="workout" class="hidden">
  <div class="tabs" id="tabs"></div>
  <div class="card">
    <div class="splitHead" id="splitHead"></div>
    <div id="exerciseList"></div>
    <button class="primary full" id="saveBtn">Save workout</button>
    <div class="msg" id="msg"></div>
  </div>
</section>

<section id="history" class="hidden">
  <div class="card"><div class="row"><h2 style="margin:0">History</h2><button class="secondary" id="csvBtn">Export CSV</button></div><div id="historyList"></div></div>
</section>

<section id="progress" class="hidden">
  <div class="card"><div class="row"><h2 style="margin:0">Progress</h2><select id="exerciseSelect"></select></div><canvas id="chart" width="700" height="280"></canvas></div>
  <div class="card"><h2 style="margin-top:0">Personal bests</h2><div id="prs"></div></div>
</section>

<section id="settings" class="hidden">
  <div class="card"><h2 style="margin-top:0">Backup</h2>
    <button class="secondary full" id="exportJson">Export backup</button>
    <label style="display:block;margin-top:12px">Import backup<input type="file" id="importJson" accept=".json,application/json"></label>
  </div>
  <div class="card"><h2 style="margin-top:0">Display</h2>
    <label>Units<select id="unitSelect"><option value="kg">kg</option><option value="lb">lb</option></select></label>
  </div>
  <div class="card"><button class="danger full" id="clearBtn">Clear all local data</button></div>
</section>
</main>

<nav><div class="navin">
<button data-view="home" class="active">Home</button>
<button data-view="workout">Workout</button>
<button data-view="history">History</button>
<button data-view="progress">Progress</button>
<button data-view="settings">Settings</button>
</div></nav>
</div>

<script>
let cfg=null, log=JSON.parse(localStorage.getItem("yonasLog")||"[]"), currentSplit=localStorage.getItem("yonasSplit")||"Split A";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
async function loadCfg(){try{cfg=await fetch("config.json").then(r=>r.json())}catch(e){cfg=JSON.parse(document.getElementById("fallbackConfig").textContent)}init()}
function save(){localStorage.setItem("yonasLog",JSON.stringify(log))}
function splitNames(){return Object.keys(cfg.splits)}
function nextSplit(){if(!log.length)return splitNames()[0];const last=log[log.length-1].split;return splitNames()[(splitNames().indexOf(last)+1)%splitNames().length]}
function show(id){["home","workout","history","progress","settings"].forEach(v=>$("#"+v).classList.toggle("hidden",v!==id));$$("nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===id));if(id==="home")renderHome();if(id==="history")renderHistory();if(id==="progress")renderProgress()}
function renderHome(){ $("#title").textContent=cfg.client+" Workout Tracker";$("#next").textContent=nextSplit();$("#done").textContent=log.length;$("#last").textContent=log.length?log[log.length-1].split:"—";$("#prCount").textContent=Object.keys(getPRs()).length}
function renderTabs(){ $("#tabs").innerHTML=splitNames().map(s=>`<button class="tab ${s===currentSplit?"active":""}" data-s="${s}">${s}</button>`).join("");$$("#tabs button").forEach(b=>b.onclick=()=>{currentSplit=b.dataset.s;localStorage.setItem("yonasSplit",currentSplit);renderWorkout()})}
function renderWorkout(){renderTabs();$("#splitHead").textContent=currentSplit;let html="",lastBlock="";cfg.splits[currentSplit].forEach((e,i)=>{if(e.block.startsWith("Superset")&&e.block!==lastBlock)html+=`<div class="superset">${e.block}</div>`;const cls=e.block==="Main Lift"?"main":e.block==="Finisher"?"finisher":"";html+=`<div class="exercise ${cls}" data-i="${i}"><h3>${e.name}</h3><div class="meta">${e.block}${e.type?" · "+e.type:""} · ${e.focus} · ${e.target}</div><div class="gridInputs"><div><label>Weight (${cfg.units})<input data-f="weight" inputmode="decimal"></label></div><div><label>Set 1<input data-f="set1" inputmode="numeric"></label></div><div><label>Set 2<input data-f="set2" inputmode="numeric"></label></div><div><label>Set 3<input data-f="set3" inputmode="numeric"></label></div></div></div>`;lastBlock=e.block});$("#exerciseList").innerHTML=html}
function saveWorkout(){const entries=[];$$(".exercise").forEach((c,i)=>{const e=cfg.splits[currentSplit][i],v=f=>c.querySelector(`[data-f="${f}"]`).value.trim();entries.push({...e,weight:v("weight"),set1:v("set1"),set2:v("set2"),set3:v("set3")})});log.push({date:new Date().toISOString(),split:currentSplit,entries});save();$("#msg").textContent="Workout saved";setTimeout(()=>$("#msg").textContent="",1500);currentSplit=nextSplit();localStorage.setItem("yonasSplit",currentSplit);renderWorkout()}
function renderHistory(){if(!log.length){$("#historyList").innerHTML='<div class="note" style="padding:20px 0">No workouts saved yet.</div>';return}$("#historyList").innerHTML='<div class="list">'+[...log].reverse().map(w=>`<div class="historyItem"><div class="row"><b>${w.split}</b><span>${new Date(w.date).toLocaleDateString()}</span></div><div class="note">${w.entries.filter(e=>e.weight).length}/${w.entries.length} exercises logged</div></div>`).join("")+"</div>"}
function names(){return [...new Set(Object.values(cfg.splits).flat().map(x=>x.name))]}
function getPRs(){const p={};log.forEach(w=>w.entries.forEach(e=>{const n=parseFloat(e.weight);if(n&&(p[e.name]==null||n>p[e.name]))p[e.name]=n}));return p}
function renderProgress(){if(!$("#exerciseSelect").options.length)$("#exerciseSelect").innerHTML=names().map(n=>`<option>${n}</option>`).join("");draw($("#exerciseSelect").value||names()[0]);const p=getPRs();$("#prs").innerHTML=Object.keys(p).length?`<table><thead><tr><th>Exercise</th><th>Best</th></tr></thead><tbody>${Object.entries(p).map(([n,v])=>`<tr><td>${n}</td><td>${v} ${cfg.units}</td></tr>`).join("")}</tbody></table>`:'<div class="note">No records yet.</div>'}
function draw(name){const c=$("#chart"),x=c.getContext("2d"),pts=[];log.forEach((w,i)=>w.entries.forEach(e=>{const v=parseFloat(e.weight);if(e.name===name&&v)pts.push({x:i+1,y:v})}));x.clearRect(0,0,c.width,c.height);x.fillStyle="#0e1728";x.fillRect(0,0,c.width,c.height);x.strokeStyle="#263650";for(let i=0;i<5;i++){let y=35+i*48;x.beginPath();x.moveTo(40,y);x.lineTo(c.width-20,y);x.stroke()}if(!pts.length){x.fillStyle="#9fb0c8";x.font="16px system-ui";x.fillText("No data yet",45,145);return}const max=Math.max(...pts.map(p=>p.y))*1.1,min=Math.min(...pts.map(p=>p.y))*0.9,xx=i=>45+(i/Math.max(pts.length-1,1))*(c.width-70),yy=v=>240-((v-min)/(max-min||1))*185;x.strokeStyle="#4f8cff";x.lineWidth=4;x.beginPath();pts.forEach((p,i)=>i?x.lineTo(xx(i),yy(p.y)):x.moveTo(xx(i),yy(p.y)));x.stroke();pts.forEach((p,i)=>{x.fillStyle="#4f8cff";x.beginPath();x.arc(xx(i),yy(p.y),5,0,Math.PI*2);x.fill();x.fillStyle="#f7f9fc";x.font="12px system-ui";x.fillText(p.y,xx(i)-8,yy(p.y)-10)})}
function exportCSV(){const rows=[["date","split","exercise","weight","set1","set2","set3"]];log.forEach(w=>w.entries.forEach(e=>rows.push([w.date,w.split,e.name,e.weight,e.set1,e.set2,e.set3])));download("yonas-workout-log.csv",rows.map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\n"),"text/csv")}
function download(name,data,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function init(){renderHome();renderWorkout();$("#unitSelect").value=cfg.units}
$$("nav button").forEach(b=>b.onclick=()=>show(b.dataset.view));$("#startBtn").onclick=()=>{currentSplit=nextSplit();renderWorkout();show("workout")};$("#saveBtn").onclick=saveWorkout;$("#csvBtn").onclick=exportCSV;$("#exerciseSelect").onchange=()=>draw($("#exerciseSelect").value);$("#exportJson").onclick=()=>download("yonas-backup.json",JSON.stringify({log,currentSplit,cfg},null,2),"application/json");$("#importJson").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);log=d.log||[];currentSplit=d.currentSplit||"Split A";save();localStorage.setItem("yonasSplit",currentSplit);alert("Backup imported")}catch{alert("Invalid backup file")}};r.readAsText(f)};$("#unitSelect").onchange=e=>{cfg.units=e.target.value;renderWorkout()};$("#clearBtn").onclick=()=>{if(confirm("Delete all local workout data?")){log=[];save();renderHome();alert("Data cleared")}};
if("serviceWorker"in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("service-worker.js");
loadCfg();
</script>

<script type="application/json" id="fallbackConfig">
{"client":"Yonas","units":"kg","splits":{"Split A":[{"block":"Main Lift","type":"","focus":"Legs","name":"Back Squat","target":"3 x 5-8"},{"block":"Superset A","type":"Push","focus":"Chest / Triceps","name":"Barbell Bench Press","target":"3 x 6-8"},{"block":"Superset A","type":"Pull","focus":"Back / Biceps","name":"Pull-Ups or Lat Pulldown","target":"3 x 8-10"},{"block":"Superset B","type":"","focus":"Posterior Chain","name":"Romanian Deadlift","target":"3 x 8-10"},{"block":"Superset B","type":"","focus":"Shoulders","name":"Dumbbell Lateral Raise","target":"3 x 12-15"},{"block":"Finisher","type":"","focus":"Biceps","name":"EZ Bar Curl","target":"3 x 10-12"}],"Split B":[{"block":"Main Lift","type":"","focus":"Posterior Chain","name":"Deadlift","target":"3 x 4-6"},{"block":"Superset A","type":"Push","focus":"Chest / Triceps","name":"Incline Dumbbell Press","target":"3 x 8-10"},{"block":"Superset A","type":"Pull","focus":"Back / Biceps","name":"Chest Supported Row","target":"3 x 8-10"},{"block":"Superset B","type":"","focus":"Legs","name":"Bulgarian Split Squat","target":"3 x 8 / leg"},{"block":"Superset B","type":"","focus":"Shoulders","name":"Seated Dumbbell Shoulder Press","target":"3 x 8-10"},{"block":"Finisher","type":"","focus":"Triceps","name":"Rope Triceps Pressdown","target":"3 x 10-12"}],"Split C":[{"block":"Main Lift","type":"","focus":"Legs","name":"Front Squat or Leg Press","target":"3 x 6-8"},{"block":"Superset A","type":"Push","focus":"Chest / Triceps","name":"Weighted Dips or Chest Press","target":"3 x 8-10"},{"block":"Superset A","type":"Pull","focus":"Back / Biceps","name":"Chin-Ups or Close-Grip Lat Pulldown","target":"3 x 8-10"},{"block":"Superset B","type":"","focus":"Glutes","name":"Barbell Hip Thrust","target":"3 x 8-10"},{"block":"Superset B","type":"","focus":"Legs","name":"Walking Lunges","target":"3 x 10 / leg"},{"block":"Finisher","type":"","focus":"Biceps","name":"Hammer Curl","target":"3 x 10-12"}]}}
</script>
</body>
</html>
